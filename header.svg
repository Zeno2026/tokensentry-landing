<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0b0d"/>
      <stop offset="50%" style="stop-color:#0f1219"/>
      <stop offset="100%" style="stop-color:#0a0b0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg)"/>
  
  <!-- Subtle glow effects -->
  <ellipse cx="400" cy="250" rx="400" ry="300" fill="url(#glow1)"/>
  <ellipse cx="1100" cy="300" rx="300" ry="200" fill="#8b5cf6" opacity="0.06"/>
  
  <!-- Grid lines for tech feel -->
  <line x1="0" y1="100" x2="1500" y2="100" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="200" x2="1500" y2="200" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="300" x2="1500" y2="300" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="400" x2="1500" y2="400" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="300" y1="0" x2="300" y2="500" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="600" y1="0" x2="600" y2="500" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="900" y1="0" x2="900" y2="500" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="1200" y1="0" x2="1200" y2="500" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Main text -->
  <text x="750" y="200" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-2">Check Before You Connect</text>
  
  <!-- Accent line -->
  <rect x="550" y="230" width="400" height="4" rx="2" fill="url(#accent)"/>
  
  <!-- Sub text -->
  <text x="750" y="290" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">Scan any token, URL, or wallet for scams — free &amp; instant</text>
  
  <!-- Risk indicators -->
  <text x="520" y="370" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4ade80" text-anchor="middle">🟢 Safe</text>
  <text x="750" y="370" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#facc15" text-anchor="middle">🟡 Caution</text>
  <text x="980" y="370" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f43f5e" text-anchor="middle">🔴 Danger</text>
  
  <!-- Bottom accent line -->
  <rect x="0" y="490" width="1500" height="10" fill="url(#accent)" opacity="0.5"/>
</svg>
